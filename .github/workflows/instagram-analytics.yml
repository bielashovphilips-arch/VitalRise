name: Instagram Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  instagram-analytics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Instagram profile and media data
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          mkdir -p instagram-data

          curl --fail --silent --show-error \
            "https://graph.instagram.com/me?fields=id,username,account_type,media_count&access_token=${INSTAGRAM_ACCESS_TOKEN}" \
            > instagram-data/profile.json

          curl --fail --silent --show-error \
            "https://graph.instagram.com/me/media?fields=id,caption,media_type,media_product_type,permalink,timestamp,like_count,comments_count&limit=100&access_token=${INSTAGRAM_ACCESS_TOKEN}" \
            > instagram-data/media.json

          echo "PROFILE:"
          cat instagram-data/profile.json
          echo ""
          echo "MEDIA:"
          cat instagram-data/media.json

      - name: Get insights for each publication
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse

          token = os.environ["INSTAGRAM_ACCESS_TOKEN"]

          with open("instagram-data/media.json", "r", encoding="utf-8") as f:
              media_data = json.load(f)

          posts = media_data.get("data", [])
          results = []

          for post in posts:
              media_id = post.get("id")
              product_type = post.get("media_product_type", "")
              media_type = post.get("media_type", "")

              item = dict(post)
              item["insights"] = {}

              # Different media types can expose different metrics.
              # Ask for useful metrics individually so one unsupported
              # metric does not break collection for the whole post.
              if product_type == "REELS":
                  metrics = [
                      "reach",
                      "saved",
                      "shares",
                      "likes",
                      "comments",
                      "views",
                      "total_interactions"
                  ]
              else:
                  metrics = [
                      "reach",
                      "saved",
                      "shares",
                      "likes",
                      "comments",
                      "views",
                      "total_interactions"
                  ]

              for metric in metrics:
                  url = (
                      f"https://graph.instagram.com/{media_id}/insights"
                      f"?metric={urllib.parse.quote(metric)}"
                      f"&access_token={urllib.parse.quote(token)}"
                  )

                  try:
                      with urllib.request.urlopen(url) as response:
                          data = json.loads(response.read().decode("utf-8"))

                      values = data.get("data", [])

                      if values:
                          value = values[0].get("values", [])
                          if value:
                              item["insights"][metric] = value[0].get("value")
                          elif "value" in values[0]:
                              item["insights"][metric] = values[0].get("value")

                  except Exception as e:
                      # Unsupported metrics are skipped instead of
                      # failing the entire workflow.
                      item["insights"][metric] = None
                      print(
                          f"Skipped {metric} for {media_id} "
                          f"({media_type}/{product_type}): {e}"
                      )

              results.append(item)

          with open(
              "instagram-data/analytics.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  results,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"Processed {len(results)} Instagram publications")
          PY

      - name: Create analytics CSV
        run: |
          python <<'PY'
          import csv
          import json

          with open(
              "instagram-data/analytics.json",
              "r",
              encoding="utf-8"
          ) as f:
              posts = json.load(f)

          columns = [
              "id",
              "timestamp",
              "media_type",
              "media_product_type",
              "caption",
              "permalink",
              "like_count",
              "comments_count",
              "views",
              "reach",
              "saved",
              "shares",
              "likes",
              "comments",
              "total_interactions",
          ]

          with open(
              "instagram-data/analytics.csv",
              "w",
              newline="",
              encoding="utf-8-sig"
          ) as f:
              writer = csv.DictWriter(f, fieldnames=columns)
              writer.writeheader()

              for post in posts:
                  insights = post.get("insights", {})

                  writer.writerow({
                      "id": post.get("id"),
                      "timestamp": post.get("timestamp"),
                      "media_type": post.get("media_type"),
                      "media_product_type":
                          post.get("media_product_type"),
                      "caption": post.get("caption", ""),
                      "permalink": post.get("permalink", ""),
                      "like_count": post.get("like_count"),
                      "comments_count":
                          post.get("comments_count"),
                      "views": insights.get("views"),
                      "reach": insights.get("reach"),
                      "saved": insights.get("saved"),
                      "shares": insights.get("shares"),
                      "likes": insights.get("likes"),
                      "comments": insights.get("comments"),
                      "total_interactions":
                          insights.get("total_interactions"),
                  })

          print("analytics.csv created")
          PY

      - name: Show generated files
        run: |
          echo "Generated files:"
          ls -lah instagram-data/

      - name: Upload Instagram analytics
        uses: actions/upload-artifact@v4
        with:
          name: instagram-analytics
          path: instagram-data/
          retention-days: 30
